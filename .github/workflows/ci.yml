name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DBT_PROFILES_DIR: ./ci

jobs:

  lint:
    name: 1. Lint SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install "sqlfluff==4.4.0"
      - run: sqlfluff lint models/ tests/ --disable-progress-bar

  parse:
    name: 2. Walidacja projektu dbt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install "dbt-snowflake~=1.12.0"
      - run: dbt deps
      - run: dbt parse --target parse_only

  build:
    name: 3. Build zmienionych modeli (Snowflake)
    runs-on: ubuntu-latest
    needs: [lint, parse]
    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_CI_SCHEMA: PR_${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install "dbt-snowflake~=1.12.0"
      - run: dbt deps

      - name: Pobierz manifest z produkcji
        id: manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prod_state
          RUN_ID=$(gh run list --workflow deploy.yml --branch main \
                     --status success --limit 1 --json databaseId \
                     --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            gh run download "$RUN_ID" --name prod-manifest --dir prod_state
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: dbt build (tylko zmienione + zalezne)
        run: |
          if [ "${{ steps.manifest.outputs.found }}" = "true" ]; then
            dbt build --target ci \
              --select state:modified+ \
              --defer --state ./prod_state \
              --favor-state
          else
            dbt build --target ci
          fi
